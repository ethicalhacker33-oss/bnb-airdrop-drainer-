<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSea - NFT Marketplace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d0d0d;color:#fff}
.container{max-width:480px;margin:0 auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #2a2a4a}
.logo{font-size:24px;font-weight:700;color:#2081e2}
.logo span{color:#fff}
.wallet-btn{background:#2081e2;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer;transition:0.3s}
.wallet-btn:hover{background:#1a6fc4}
.nft-card{background:#1a1a2e;border-radius:16px;padding:20px;margin-top:20px;border:1px solid #2a2a4a}
.nft-image{width:100%;height:200px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:64px}
.nft-title{font-size:20px;font-weight:600;margin-top:15px}
.nft-price{color:#2081e2;font-size:18px;font-weight:600;margin-top:5px}
.nft-desc{color:#888;font-size:14px;margin-top:8px}
.mint-btn{width:100%;padding:16px;background:#2081e2;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:20px;transition:0.3s}
.mint-btn:hover{background:#1a6fc4;transform:scale(1.02)}
.mint-btn:disabled{background:#555;cursor:not-allowed}
.stats{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #2a2a4a;font-size:13px;color:#888}
.stats span{color:#fff}
.footer{text-align:center;padding:20px 0;font-size:12px;color:#444}
.status{background:#1a2a4a;padding:12px;border-radius:8px;margin-top:15px;font-size:13px;display:none}
.status.success{background:#0d4a0d;color:#4caf50;display:block}
.status.error{background:#4a0d0d;color:#ff4444;display:block}
.status.loading{background:#1a2a4a;color:#f0b90b;display:block}
.status.info{background:#1a2a4a;color:#4ecdc4;display:block}
.page-selector{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;justify-content:center}
.page-btn{background:#1a1a2e;border:1px solid #2a2a4a;padding:6px 12px;border-radius:20px;color:#888;cursor:pointer;font-size:12px;transition:0.3s}
.page-btn:hover{background:#2a2a4a;color:#fff}
.page-btn.active{background:#2081e2;color:#fff;border-color:#2081e2}
</style>
</head>

<div>Volume: <span id="volume">0.00</span></div>
</div>

<div class="page-selector">
<button class="page-btn active" data-page="opensea">🎨 OpenSea</button>
<button class="page-btn" data-page="blur">🌀 Blur</button>
<button class="page-btn" data-page="collab">🤝 Collab</button>
<button class="page-btn" data-page="uniswap">🦄 Uniswap</button>
</div>

<div class="nft-card" id="nftCard">
<div class="nft-image" id="nftImage" style="background:linear-gradient(135deg,#2081e2,#6c5ce7)">🎨</div>
<div class="nft-title" id="nftTitle">CyberPunk #420</div>

<button class="mint-btn" id="mintBtn" disabled>Mint NFT</button>
<div id="status" class="status"></div>

<div class="footer">© 2026 OpenSea. All rights reserved.</div>
